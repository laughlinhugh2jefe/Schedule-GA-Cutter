<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GA Cutter</title>
<link rel="apple-touch-icon" href="../icon.png">
<link rel="icon" href="../icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GA Cutter">
<meta name="mobile-web-app-capable" content="yes">
<style>
  html,body{
    height:100%;
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#ffffff;
    color:#1a1a1a;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .wrap{
    text-align:center;
    padding:24px;
    max-width:340px;
  }
  img{
    width:120px;
    height:120px;
    border-radius:22px;
    box-shadow:0 4px 16px rgba(0,0,0,0.15);
    margin-bottom:20px;
  }
  a.btn{
    display:inline-block;
    background:#c1272d;
    color:#fff;
    text-decoration:none;
    font-weight:600;
    padding:14px 28px;
    border-radius:10px;
    font-size:17px;
  }
  p.sub{
    color:#666;
    font-size:14px;
    margin-top:16px;
    line-height:1.4;
  }
</style>
</head>
<body>
<div class="wrap">
  <img src="../icon.png" alt="Georgia Cutter">
  <div><a class="btn" id="openBtn" href="#">Open GA Cutter</a></div>
  <p class="sub">The schedule and bid notes, for Hugh and Todd. First time here? Tap the Share icon below, then "Add to Home Screen" to put it on your phone as an app.</p>
</div>
<script>
  // The GA Cutter App (Google Apps Script web app). It only lets in the Google accounts it was set up for.
  var APP_URL = "https://script.google.com/macros/s/AKfycbz7ge_fL6ljoS9JfwwSxNfzhrM-abqapcSBBJWsWCXx0iXCicOl8TjTOH8Hvf-p6Z2Q/exec";
  document.getElementById("openBtn").href = APP_URL;
  // When launched from the Home Screen icon, go straight to the app.
  if (window.navigator.standalone || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)) {
    window.location.replace(APP_URL);
  }
</script>
</body>
</html>
